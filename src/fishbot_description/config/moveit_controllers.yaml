# MoveIt 控制器映射：将规划结果通过 arm_controller 执行（与 ros2_control 的 joint_trajectory_controller 对接）
# 参数需位于 moveit_simple_controller_manager 命名空间下（插件要求）
moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
